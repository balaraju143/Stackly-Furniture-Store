
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f6f0e5">
    <title>404 | Page Not Found — Stackly</title>

    <link rel="stylesheet" href="css/404.css">

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=Italiana&display=swap" rel="stylesheet">
</head>
<body>

    <main class="error-page">

        <div class="error-decoration error-decoration-one"></div>
        <div class="error-decoration error-decoration-two"></div>

        <section class="error-card" aria-labelledby="error-title">

            <!-- Stackly Logo -->
            <a href="index.html" class="error-logo" aria-label="Stackly homepage">
                <img src="assets/black-logo.webp" alt="Stackly">
            </a>

            <!-- Decorative Number -->
            <div class="error-illustration" aria-hidden="true">
                <span class="error-number">404</span>

                <div class="error-icon">
                    <svg viewBox="0 0 100 100" fill="none">
                        <path d="M22 37 L50 15 L78 37 L78 78 L22 78 Z"
                              stroke="currentColor"
                              stroke-width="2"
                              stroke-linejoin="round"/>

                        <path d="M40 78 V53 Q50 42 60 53 V78"
                              stroke="currentColor"
                              stroke-width="2"
                              stroke-linejoin="round"/>

                        <path d="M12 85 H88"
                              stroke="currentColor"
                              stroke-width="2"
                              stroke-linecap="round"/>

                        <circle cx="50" cy="32" r="4"
                                fill="currentColor"/>
                    </svg>
                </div>
            </div>

            <!-- Content -->
            <div class="error-content">
                <span class="error-eyebrow">
                    A LITTLE OFF THE PATH
                </span>

                <h1 id="error-title">
                    This page has<br>
                    <span>moved out.</span>
                </h1>

                <p class="error-description">
                    It looks like this space is no longer available.
                    Let's help you find your way back to beautiful
                    furniture, thoughtful details, and timeless design.
                </p>

                <div class="error-actions">
                    <a href="index.html" class="error-btn error-btn-primary">
                    
                        Back to Home
                    </a>

                    <button type="button"
                            class="error-btn error-btn-secondary"
                            id="backButton">
                        Go Back
                    
                    </button>
                </div>

                <p class="error-code">ERROR CODE <span>404</span></p>
            </div>

        </section>

        <p class="error-footer">
            Made for living. Designed to last.
        </p>

    </main>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.13.0/gsap.min.js"></script>
    <script src="js/404.js"></script>

</body>
</html>
